# Continuous integration.
#
# The whole pipeline runs with no API keys configured. That is not a
# limitation of the workflow, it is a property of the test suite: unit tests
# script the model, and the end-to-end golden suite replays the plan, SQL and
# narrative that the live system actually produced, then runs them through the
# real guard, the real SQLite database and the real verifier. So CI checks the
# part that must never break silently — the data path — without a network call
# or a cent of spend.
#
# The database is rebuilt from the workbook on every run rather than trusting
# the committed file, and the quality gate runs against the result. If the ETL
# ever stops reproducing the shipped data, this fails here rather than in a
# demo.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build, validate, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build the database from the workbook
        working-directory: backend
        run: python -m app.etl.build_db

      - name: Run the data quality gate
        working-directory: backend
        run: python -m app.etl.quality_checks

      - name: Run the test suite
        working-directory: backend
        # No API keys are set. The suite must pass without them; if it ever
        # needs one, that is a bug in the test, not a reason to add a secret.
        run: python -m pytest tests/ -q

      - name: Confirm the cache answers without a provider
        run: python scripts/check_offline.py

  frontend:
    name: Frontend — lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
